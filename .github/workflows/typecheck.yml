name: typecheck

# Kept as a thin companion to ci.yml so PRs still get a known-good gate if
# the newer workflow is awaiting first-run approval. Prefer ci.yml once green.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm run build
