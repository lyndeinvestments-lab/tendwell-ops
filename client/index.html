<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 stops iOS Safari's automatic zoom-on-input-focus (the
         "app looks shifted/cut off" bug). Since iOS 10, users can still
         pinch-zoom manually — Safari deliberately ignores the cap for manual
         gestures, so this does not hurt accessibility. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="Tendwell Ops — property management operations dashboard for tracking properties, costs, linens, access codes, and more." />
    <meta name="author" content="Tendwell" />
    <meta property="og:title" content="Tendwell Ops" />
    <meta property="og:description" content="Property management operations dashboard" />
    <meta property="og:type" content="website" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tendwell" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f7f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121615" />
    <link rel="canonical" href="https://www.tendwellcleaning.com/" />
    <!-- Start the Supabase TLS handshake during HTML parse so the first DB call
         doesn't pay for it. Vite expands %VITE_SUPABASE_URL% at build time. -->
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%">
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
